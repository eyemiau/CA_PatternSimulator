<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор узоров | Клеточный автомат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Секция с холстом (View) -->
        <main class="canvas-section">
            <canvas id="gameCanvas"></canvas>
        </main>

        <!-- Панель управления (Контролы для Controller) -->
        <aside class="controls-section">
            <h2>Настройки</h2>
            
            <div class="control-group">
                <button id="btnPlay">Старт</button>
                <button id="btnPause">Пауза</button>
                <button id="btnClear">Очистить</button>
            </div>

            <div class="control-group">
                <label for="birthRule">Рождение (соседей): <span id="birthValue">3</span></label>
                <!-- Ползунок от 1 до 8 соседей -->
                <input type="range" id="birthRule" min="1" max="8" value="3">
            </div>

            <div class="control-group">
                <label for="surviveMin">Выживание (мин): <span id="surviveMinValue">2</span></label>
                <input type="range" id="surviveMin" min="1" max="8" value="2">
            </div>

            <div class="control-group">
                <label for="surviveMax">Выживание (макс): <span id="surviveMaxValue">3</span></label>
                <input type="range" id="surviveMax" min="1" max="8" value="3">
            </div>
        </aside>
    </div>

    <!-- Подключаем главный скрипт как модуль -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
